[project]
name = "agent"
version = "0.1.0"
description = "사내 업무 도우미 백엔드(APP-02 플랫폼 API)"
authors = [
    { name = "Gunwoo", email = "rkdrjsdn1000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# 실제 모델 호출(과금) 테스트는 기본에서 뺀다. `-m live_model`로 명시할 때만 돈다.
addopts = ["-p", "no:cacheprovider", "-m", "not live_model"]
markers = ["live_model: 실제 Anthropic API를 호출한다(과금). 명시적으로 -m live_model을 줄 때만 실행"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# E/F/W 기본, I import 정렬, B 버그 패턴, UP 최신 문법, ASYNC 비동기 안 차단 호출, S 보안
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# 프롬프트 문장은 모델에 그대로 가므로 줄을 끊지 않는다.
"src/agent/modules/agent_runtime/prompt.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "tests"]
