[project]
name = "agent"
version = "0.1.0"
description = "사내 업무 도우미 백엔드(APP-02 플랫폼 API)"
authors = [
    { name = "Gunwoo", email = "rkdrjsdn1000@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# E/F/W 기본, I import 정렬, B 버그 패턴, UP 최신 문법, ASYNC 비동기 안 차단 호출, S 보안
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "tests"]
