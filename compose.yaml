name: internal-ai-chatbot

services:
  db:
    # 정확한 태그로 고정한다(pgvector 0.8.7, PostgreSQL 18). latest는 쓰지 않는다.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: agent_dev
    ports:
      # 5432~5434는 이 PC의 다른 DB가 쓰고 있다. 외부 노출 없이 loopback에만 연다.
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 데이터 폴더를 만든다.
      - db-data:/var/lib/postgresql
      # 첫 기동 때 테스트 DB(agent_test)를 만든다. 확장과 테이블은 Alembic이 만든다.
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agent_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # 평소 개발은 로컬 uvicorn으로 한다. 컨테이너 실행 확인이 필요할 때만 --profile api로 띄운다.
    # 재현 데모(--profile demo)는 AUTH_MODE=local_session으로 실제 로그인을 쓴다.
    profiles: ["api", "demo"]
    build: ./backend
    environment:
      APP_ENV: local
      AUTH_MODE: ${AUTH_MODE:-test_stub}
      TEST_ACTOR_ID: ${TEST_ACTOR_ID:-test-a}
      OPERATOR_USER_ID: ${OPERATOR_USER_ID:-ops-admin}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/agent_dev
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5190,http://127.0.0.1:5190}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      # test_stub은 loopback에만 노출한다(docs/12-first-milestone-spec.md).
      - "127.0.0.1:8010:8010"
    depends_on:
      db:
        condition: service_healthy

  seed:
    # 재현 데모용 1회 실행: 개발 DB 마이그레이션, 데모 조직·지원 범위, 교육 fixture(재실행해도 중복 없음).
    profiles: ["demo"]
    build: ./backend
    environment:
      APP_ENV: local
      AUTH_MODE: local_session
      OPERATOR_USER_ID: ops-admin
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/agent_dev
    command:
      - sh
      - -c
      - >-
        /app/.venv/bin/alembic upgrade head &&
        /app/.venv/bin/python -m agent.cli seed-identity &&
        /app/.venv/bin/python -m agent.cli seed-trainings --mode fixed_status
    depends_on:
      db:
        condition: service_healthy

  web:
    # 직원 웹(MOD-08): 정적 빌드 + /api 프록시. http://127.0.0.1:5190
    profiles: ["demo"]
    build: ./frontend
    ports:
      - "127.0.0.1:5190:5190"
    depends_on:
      - api

volumes:
  db-data:
